name: Build JM@Santé APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      # ── Build app.js (prod sur tag, dev sinon) ───────────────────────────
      - name: Build app.js
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npm install -D esbuild && npm run build:prod
          else
            npm run build
          fi

      - name: Capacitor add android
        run: npx cap add android

      # ── Générer toutes les tailles d'icône Android depuis resources/icon.png ──
      - name: Generate Android icons
        run: |
          pip install Pillow --quiet
          python3 - <<'PYEOF'
          from PIL import Image
          import os, shutil

          src = "resources/icon.png"
          if not os.path.exists(src):
              print("Pas de resources/icon.png — icônes par défaut conservées")
              exit()

          img = Image.open(src).convert("RGBA")

          sizes = {
              "mipmap-mdpi":    48,
              "mipmap-hdpi":    72,
              "mipmap-xhdpi":   96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in sizes.items():
              dest = f"android/app/src/main/res/{folder}"
              os.makedirs(dest, exist_ok=True)
              icon = img.resize((px, px), Image.LANCZOS)
              icon.save(f"{dest}/ic_launcher.png")
              icon.save(f"{dest}/ic_launcher_round.png")
              # Foreground (110% du canvas pour les adaptive icons)
              fg_px = int(px * 1.1)
              fg = img.resize((fg_px, fg_px), Image.LANCZOS)
              canvas = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              off = (px - fg_px) // 2
              canvas.paste(fg, (off, off))
              canvas.save(f"{dest}/ic_launcher_foreground.png")
              print(f"  {folder}: {px}px ✓")

          print("Icônes générées ✓")
          PYEOF


      # ── Post cap add : splash jour/nuit + plugin natif JMSaveFile (MediaStore) ──
      - name: Post cap add (splash + native save plugin)
        run: node scripts/postcap.js
      - name: Capacitor sync
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ⚠️ Sans ceci l'action tente d'installer le paquet « tools »,
          # retiré du dépôt SDK par Google : « Failed to find package
          # 'tools' » et la compilation échoue. Le runner GitHub fournit
          # déjà tout ce qu'il faut ; Gradle télécharge le reste.
          packages: ''

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ⚠️ La clé n'existe que le temps de la compilation : elle arrive
      # encodée dans un secret, jamais dans le dépôt.
      # ⚠️ Sans clé, assembleRelease produirait un APK NON SIGNÉ,
      # impossible à installer — et l'échec n'apparaîtrait que sur le
      # téléphone. On s'arrête ici, avec un message clair.
      - name: Vérifier la présence des secrets
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PWD_: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          manque=""
          [ -z "$B64" ]   && manque="$manque ANDROID_KEYSTORE_B64"
          [ -z "$PWD_" ]  && manque="$manque ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && manque="$manque ANDROID_KEY_ALIAS"
          if [ -n "$manque" ]; then
            echo "::error::Secret(s) manquant(s) :$manque — dépôt → Settings → Secrets and variables → Actions"
            exit 1
          fi
          # ⚠️ Un alias copié depuis « keytool -list » traîne une tabulation :
          # Gradle cherche alors une clé nommée « \tjmsante » et échoue.
          PROPRE=$(printf '%s' "$ALIAS" | tr -d '[:space:]')
          if [ "$PROPRE" != "$ALIAS" ]; then
            echo "::warning::ANDROID_KEY_ALIAS contient des espaces ou tabulations — ils sont ignorés, mais corrige le secret."
          fi
          echo "Secrets présents. Alias utilisé : « $PROPRE »"

      - name: Restaurer la clé de signature
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$B64" | tr -d '\r\n ' | base64 -d > android/jmsante.p12
          ls -la android/jmsante.p12

      # ⚠️ assembleRelease, plus assembleDebug : c'est la clé de débogage,
      # régénérée à chaque compilation, qui empêchait d'installer une mise
      # à jour par-dessus la version précédente.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          KEYSTORE_FILE: ${{ github.workspace }}/android/jmsante.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # ⚠️ Informatif : cette étape ne doit JAMAIS faire échouer la
      # compilation. apksigner n'est pas toujours au même endroit selon
      # la version des build-tools installées sur le runner.
      - name: Vérifier la signature
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::warning::APK introuvable à $APK"
            find android/app/build/outputs -name "*.apk" -print 2>/dev/null || true
            exit 0
          fi
          ls -la "$APK"
          SIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | head -20
          else
            echo "apksigner introuvable — vérification ignorée"
          fi

      # La clé ne doit pas traîner sur le runner
      - name: Effacer la clé
        if: always()
        run: rm -f android/jmsante.p12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmsante-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: "JM@Santé ${{ github.ref_name }}"
