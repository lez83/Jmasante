name: Build JM@Santé Windows

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Build app.js
        run: node build.js

      - name: Install Electron toolchain
        run: npm install --no-save electron@33 electron-builder@25

      - name: Build Windows installer + portable
        run: npx electron-builder --win --publish=never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JMSante-Windows
          path: |
            dist-electron/JMSante-Setup-*.exe
            dist-electron/JMSante-Portable-*.exe
          retention-days: 30

      # Sur tag vX.Y.Z → attacher les exe à la Release GitHub
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/JMSante-Setup-*.exe
            dist-electron/JMSante-Portable-*.exe
