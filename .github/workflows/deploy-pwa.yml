name: Deploy PWA (GitHub Pages)

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app.js
        run: node build.js

      # Le dossier www/ est le site : il contient index.html, le manifest,
      # le service worker, les icônes et l'app compilée.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages automatiquement si ce n'est pas déjà fait
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
